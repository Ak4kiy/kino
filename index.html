<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Кино на день</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0f0f14; --panel:#1a1a23; --panel2:#23232f; --line:#2f2f3d;
  --text:#f1f1f5; --muted:#9a9aab; --accent:#ffb627; --good:#3ecf8e; --bad:#ff5e5b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(1200px 600px at 50% -200px,#2a1f3d 0%,var(--bg) 60%) var(--bg);color:var(--text);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;display:flex;flex-direction:column;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);background:rgba(15,15,20,.8);backdrop-filter:blur(6px);position:sticky;top:0;z-index:5}
.logo{font-weight:800;letter-spacing:.5px;font-size:18px;white-space:nowrap}
.logo span{color:var(--accent)}
nav{display:flex;gap:6px}
nav button{background:transparent;border:1px solid transparent;color:var(--muted);padding:8px 14px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
nav button:hover{color:var(--text);background:var(--panel)}
nav button.active{color:var(--text);background:var(--panel2);border-color:var(--line)}
main{flex:1;width:100%;max-width:900px;margin:0 auto;padding:22px 20px 40px}
.view{display:none}.view.active{display:block}

/* постер */
.poster{position:relative;overflow:hidden;background:var(--g);}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.poster img.ok{opacity:1}
.poster .ini{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;color:rgba(255,255,255,.35)}

/* рулетка */
.date{color:var(--muted);text-align:center;font-size:14px;margin-bottom:6px}
h1{text-align:center;margin:0 0 20px;font-size:28px}
.roulette{position:relative;height:270px;overflow:hidden;border-radius:18px;background:var(--panel);border:1px solid var(--line);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.strip{position:absolute;left:0;top:20px;display:flex;gap:12px;will-change:transform}
.card{flex:0 0 150px;height:225px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.card .ini{font-size:56px;align-items:flex-start;padding-top:30px}
.card .cap{position:absolute;left:0;right:0;bottom:0;padding:30px 10px 10px;background:linear-gradient(transparent,rgba(0,0,0,.85));z-index:1}
.card .t{font-weight:700;font-size:13px;line-height:1.2}
.card .y{font-size:11px;opacity:.8;margin-top:3px}
.card.win{box-shadow:0 0 0 3px var(--accent),0 0 30px rgba(255,182,39,.6)}
.marker{position:absolute;left:50%;top:0;bottom:0;width:0;z-index:2}
.marker::before,.marker::after{content:"";position:absolute;left:-11px;border:11px solid transparent;filter:drop-shadow(0 0 6px var(--accent))}
.marker::before{top:0;border-top-color:var(--accent)}
.marker::after{bottom:0;border-bottom-color:var(--accent)}

.center{text-align:center;margin-top:26px}
.big{font:inherit;font-size:30px;font-weight:900;letter-spacing:3px;padding:22px 70px;border:none;border-radius:999px;cursor:pointer;color:#1a1200;
  background:linear-gradient(135deg,#ffd166,#ffb627 45%,#ff8c42);box-shadow:0 10px 30px rgba(255,140,66,.35),inset 0 -4px 0 rgba(0,0,0,.15);transition:transform .15s,filter .15s}
.big:hover{transform:translateY(-2px) scale(1.02);filter:brightness(1.05)}
.big:active{transform:scale(.98)}
.big:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed;transform:none}

.result{display:none;margin-top:24px}
.result.show{display:flex;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.result,.done{gap:22px;align-items:center;padding:20px;border-radius:18px;background:var(--panel);border:1px solid var(--line)}
.bigposter{flex:0 0 auto;width:150px;height:225px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.bigposter .ini{font-size:60px}
.rinfo{flex:1;min-width:0}
.rinfo .label{color:var(--muted);font-size:14px}
.rinfo .title{font-size:28px;font-weight:800;margin:4px 0;line-height:1.15}
.rinfo .meta{color:var(--muted)}
.link{display:inline-block;margin-top:8px;color:var(--accent);font-size:14px;text-decoration:none;cursor:pointer}
.link:hover{text-decoration:underline}
.actions{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}
.btn{font:inherit;font-size:17px;font-weight:700;padding:13px 30px;border-radius:14px;border:none;cursor:pointer;transition:transform .12s,filter .12s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none;filter:none}
.btn.watch{background:var(--good);color:#04210f}
.btn.skip{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.hint{color:var(--muted);font-size:13px;margin-top:12px}
.done{display:none;margin-top:24px}
.done.show{display:flex}
.pill{display:inline-block;background:rgba(62,207,142,.15);color:var(--good);padding:4px 12px;border-radius:999px;font-size:13px;font-weight:600}

/* списки */
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.toolbar h2{margin:0;font-size:22px}
.count{color:var(--muted);font-size:14px}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.thumb{flex:0 0 54px;height:80px;border-radius:8px;cursor:pointer}
.thumb .ini{font-size:22px}
.info{flex:1;min-width:0}
.info .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .s{color:var(--muted);font-size:13px;margin-top:2px}
.stars{display:flex;gap:1px;margin-top:6px;flex-wrap:wrap}
.star{background:none;border:none;padding:0 1px;font-size:21px;line-height:1;cursor:pointer;color:#45455a;transition:transform .1s,color .1s}
.star.on{color:var(--accent)}
.star:hover{transform:scale(1.2)}
.score{flex:0 0 auto;font-weight:800;font-size:18px;color:var(--accent);min-width:48px;text-align:right}
.score.none{color:var(--muted);font-weight:500;font-size:12px}
.x{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:6px;border-radius:8px}
.x:hover{color:var(--bad);background:var(--panel2)}
.empty{color:var(--muted);text-align:center;padding:40px 0}
select,input{font:inherit;font-size:14px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.add{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.add input{flex:1 1 160px}
.add input.yr{flex:0 0 80px}
.small{font:inherit;font-size:14px;font-weight:600;padding:9px 16px;border-radius:10px;border:none;cursor:pointer;background:var(--accent);color:#1a1200}
.small.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.footer-tools{display:flex;gap:8px;justify-content:center;margin-top:30px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--panel2);border:1px solid var(--line);padding:12px 20px;border-radius:12px;transition:transform .25s;z-index:30;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}

/* модалка постера */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.show{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;width:100%;max-width:440px}
.mbox h3{margin:0 0 4px}
.mrow{display:flex;gap:14px;margin:14px 0}
.mrow .bigposter{width:110px;height:165px}
.mcol{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.mcol input{width:100%}
.mfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

@media (max-width:600px){
  header{flex-direction:column;align-items:stretch;padding:10px 12px}
  .logo{text-align:center}
  nav{justify-content:center}
  nav button{flex:1;padding:8px 6px;font-size:13px}
  main{padding:16px 12px 30px}
  h1{font-size:22px}
  .card{flex-basis:120px;height:180px}
  .roulette{height:220px}
  .big{font-size:24px;padding:18px 50px}
  .result,.done{flex-direction:column;text-align:center}
  .actions{justify-content:center}
  .btn{flex:1;padding:13px 10px}
  .score{min-width:36px;font-size:15px}
  .star{font-size:15px;padding:0}
  .item{gap:10px}
}
</style>
</head>
<body>
<header>
  <div class="logo">🎬 Кино <span>на день</span></div>
  <nav>
    <button data-view="spin" class="active">Рулетка</button>
    <button data-view="watched">Просмотрено</button>
    <button data-view="pool">Все фильмы</button>
  </nav>
</header>

<main>
  <section id="spin" class="view active">
    <div class="date" id="today"></div>
    <h1>Что смотрим сегодня?</h1>
    <div class="roulette"><div class="marker"></div><div class="strip" id="strip"></div></div>

    <div class="center" id="spinWrap"><button class="big" id="spinBtn">КРУТИТЬ</button></div>

    <div class="result" id="result">
      <div class="bigposter poster" id="rPoster"></div>
      <div class="rinfo">
        <div class="label">Выпал фильм</div>
        <div class="title" id="rTitle"></div>
        <div class="meta" id="rMeta"></div>
        <a class="link" id="rSearch">Найти на Кинопоиске ↗</a>
        <div class="actions">
          <button class="btn watch" id="watchBtn">Смотреть</button>
          <button class="btn skip" id="skipBtn">Не смотреть</button>
        </div>
        <div class="hint" id="hint"></div>
      </div>
    </div>

    <div class="done" id="done">
      <div class="bigposter poster" id="dPoster"></div>
      <div class="rinfo">
        <span class="pill">Фильм на сегодня выбран</span>
        <div class="title" id="dTitle"></div>
        <div class="meta" id="dMeta"></div>
        <a class="link" id="dSearch">Найти на Кинопоиске ↗</a>
        <div class="hint">Приятного просмотра! Новая прокрутка — завтра.</div>
      </div>
    </div>
  </section>

  <section id="watched" class="view">
    <div class="toolbar">
      <div><h2>Просмотрено</h2><div class="count" id="wCount"></div></div>
      <select id="wSort">
        <option value="date">Сначала новые</option>
        <option value="rating">По оценке</option>
        <option value="title">По названию</option>
      </select>
    </div>
    <div class="list" id="wList"></div>
  </section>

  <section id="pool" class="view">
    <div class="toolbar">
      <div><h2>Фильмы в рулетке</h2><div class="count" id="pCount"></div></div>
      <input id="pFilter" placeholder="Поиск…">
    </div>
    <div class="add">
      <input id="addTitle" placeholder="Название фильма">
      <input id="addYear" class="yr" placeholder="Год" inputmode="numeric">
      <input id="addGenre" placeholder="Жанр" style="flex:0 1 140px">
      <button class="small" id="addBtn">Добавить</button>
    </div>
    <div class="hint" style="margin:-6px 0 14px">Постер для нового фильма подтянется сам. Нажми на постер, чтобы поменять его.</div>
    <div class="list" id="pList"></div>
    <div class="footer-tools" id="backupTools">
      <button class="small ghost" id="exportBtn">Сохранить резервную копию</button>
      <button class="small ghost" id="importBtn">Загрузить копию</button>
      <input type="file" id="importFile" accept=".json" hidden>
    </div>
  </section>
</main>

<div class="modal" id="modal">
  <div class="mbox">
    <h3 id="mTitle"></h3>
    <div class="count">Постер фильма</div>
    <div class="mrow">
      <div class="bigposter poster" id="mPoster"></div>
      <div class="mcol">
        <button class="small" id="mAuto">Найти автоматически</button>
        <input id="mUrl" placeholder="или вставь ссылку на картинку">
        <button class="small ghost" id="mClear">Убрать постер</button>
      </div>
    </div>
    <div class="mfoot">
      <button class="small ghost" id="mCancel">Отмена</button>
      <button class="small" id="mSave">Сохранить</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

const DEF = {}; const DEF_BY_TITLE = {};
DEFAULT_FILMS.forEach(([title,year,genre],i)=>{ const f={id:"d"+i,title,year,genre,poster:POSTERS[title]||""}; DEF[f.id]=f; DEF_BY_TITLE[title.toLowerCase()]=f; });

/* ---------- окружение ---------- */
const TG = (window.Telegram && Telegram.WebApp && Telegram.WebApp.initData) ? Telegram.WebApp : null;
const CLOUD = TG && TG.isVersionAtLeast && TG.isVersionAtLeast("6.9") && TG.CloudStorage ? TG.CloudStorage : null;
if(TG){
  TG.ready(); TG.expand();
  try{ TG.setHeaderColor("#0f0f14"); TG.setBackgroundColor("#0f0f14"); }catch(e){}
  document.getElementById("backupTools").style.display="none";
}
function openLink(url){ if(TG) TG.openLink(url); else window.open(url,"_blank","noopener"); }
function haptic(kind){ try{ if(!TG) return; if(kind==="tick") TG.HapticFeedback.selectionChanged(); else TG.HapticFeedback.notificationOccurred(kind); }catch(e){} }

/* ---------- хранилище ---------- */
const KEY="kino-na-den-v1";
const $ = s => document.querySelector(s);
const todayStr = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const uid = () => "u"+Math.random().toString(36).slice(2,10);
const cloudCall=(fn,...a)=>new Promise((res,rej)=>CLOUD[fn](...a,(err,val)=>err?rej(err):res(val)));

function compact(s){
  const slim=f=>{ const d=DEF[f.id]; if(d&&d.title===f.title&&(f.poster||"")===d.poster) return {id:f.id}; return {id:f.id,title:f.title,year:f.year,genre:f.genre,poster:f.poster||""}; };
  return {v:2,pool:s.pool.map(f=>{const o=slim(f);return o.title?o:o.id;}),
    watched:s.watched.map(f=>({...slim(f),date:f.date,rating:f.rating||0})),day:s.day};
}
function expand(raw){
  const idMap={};
  const full=x=>{
    if(typeof x==="string") x={id:x};
    let f={...x};
    if(DEF[f.id] && !f.title) f={...DEF[f.id],...f,title:DEF[f.id].title};
    if(!/^d\d+$/.test(f.id||"")){ const d=f.title&&DEF_BY_TITLE[f.title.toLowerCase()]; if(d){ idMap[f.id]=d.id; f.id=d.id; } }
    if(!f.id) f.id=uid();
    const d=DEF[f.id];
    if(d){ if(!f.poster) f.poster=d.poster; if(!f.year) f.year=d.year; if(!f.genre) f.genre=d.genre; }
    return f;
  };
  const s={pool:(raw.pool||[]).map(full),watched:(raw.watched||[]).map(x=>{const f=full(x);f.rating=f.rating||0;return f;}),day:raw.day||null};
  if(s.day&&s.day.current&&idMap[s.day.current]) s.day.current=idMap[s.day.current];
  return s;
}
function freshState(){ return {pool:Object.values(DEF).map(f=>({...f})),watched:[],day:null}; }

async function loadState(){
  let raw=null;
  if(CLOUD){
    try{
      const n=parseInt(await cloudCall("getItem","n"))||0;
      if(n){ const keys=[...Array(n).keys()].map(i=>"c"+i); const vals=await cloudCall("getItems",keys); raw=JSON.parse(keys.map(k=>vals[k]||"").join("")); }
    }catch(e){ console.warn("cloud load",e); }
  }
  if(!raw){ try{ raw=JSON.parse(localStorage.getItem(KEY)); }catch(e){} }
  let s=(raw&&Array.isArray(raw.pool))?expand(raw):freshState();
  if(!s.day||s.day.date!==todayStr()) s.day={date:todayStr(),current:null,rerollUsed:false,decided:false};
  return s;
}
let cloudTimer=null, cloudPrevN=0;
function save(){
  const str=JSON.stringify(compact(S));
  try{ localStorage.setItem(KEY,str); }catch(e){}
  if(CLOUD){
    clearTimeout(cloudTimer);
    cloudTimer=setTimeout(async()=>{
      try{
        const parts=str.match(/[\s\S]{1,3800}/g)||[""];
        for(let i=0;i<parts.length;i++) await cloudCall("setItem","c"+i,parts[i]);
        await cloudCall("setItem","n",String(parts.length));
        if(cloudPrevN>parts.length){ const extra=[]; for(let i=parts.length;i<cloudPrevN;i++) extra.push("c"+i); await cloudCall("removeItems",extra); }
        cloudPrevN=parts.length;
      }catch(e){ console.warn("cloud save",e); toast("Не удалось сохранить в облако Telegram"); }
    },400);
  }
}
let S=null;

/* ---------- постеры ---------- */
function hue(str){ let h=0; for(const c of str) h=(h*31+c.charCodeAt(0))%360; return h; }
function grad(t){ const h=hue(t); return `linear-gradient(160deg,hsl(${h} 60% 42%),hsl(${(h+50)%360} 55% 22%))`; }
function ini(t){ return t.replace(/[«»"'.…]/g,"").trim().charAt(0).toUpperCase(); }
function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function posterHTML(f){
  return `<div class="ini">${esc(ini(f.title))}</div>`+(f.poster?`<img src="${esc(f.poster)}" alt="" loading="lazy" referrerpolicy="no-referrer" data-fid="${esc(f.id)}" onload="this.classList.add('ok')" onerror="posterFailed(this)">`:"");
}
function fillPoster(el,f){ el.style.setProperty("--g",grad(f.title)); el.innerHTML=posterHTML(f); }
const triedFix=new Set();
window.posterFailed=function(img){
  const inModal=!!img.closest("#mPoster"); img.remove(); if(inModal) return;
  const id=img.dataset.fid, f=findFilm(id);
  if(f && !triedFix.has(id)){ triedFix.add(id); queuePoster(f,true); }
};
function findFilm(id){ return S.pool.find(f=>f.id===id)||S.watched.find(f=>f.id===id)||(S.modalFilm&&S.modalFilm.id===id?S.modalFilm:null); }

// поиск постера в русской Википедии (без ключей)
const WIKI="https://ru.wikipedia.org/w/api.php?origin=*&format=json&";
const norm=s=>String(s).toLowerCase().replace(/ё/g,"е").replace(/[^a-zа-я0-9]/g,"");
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function wj(q){ await sleep(350); const r=await fetch(WIKI+q); return r.json(); }
async function lookupPoster(title,year){
  const d=await wj("action=query&list=search&srlimit=10&srsearch="+encodeURIComponent(title+(year?" "+year:"")+" фильм"));
  const res=(d.query&&d.query.search||[]).map(x=>x.title), k=norm(title);
  const base=x=>norm(x.replace(/\s*\(.*\)\s*$/,""));
  let cands=res.filter(x=>base(x)===k);
  cands.sort((a,b)=>score(b)-score(a));
  function score(x){ let s=0; if(year&&x.includes(String(year))) s+=10; if(/\((фильм|мультфильм|аниме)/.test(x)) s+=3; if(!/\(/.test(x)) s+=2; if(/сериал|роман|книг|франшиз|значения/.test(x)) s-=20; return s; }
  if(!cands.length) cands=res.filter(x=>/фильм|мультфильм/.test(x)&&base(x).startsWith(k.slice(0,6)));
  for(const page of cands.slice(0,4)){
    const p=Object.values((await wj("action=query&prop=revisions&rvprop=content&rvslots=main&rvsection=0&redirects=1&titles="+encodeURIComponent(page))).query.pages)[0];
    const txt=p.revisions?.[0]?.slots?.main?.["*"]||"";
    if(/\{\{\s*(неоднозначность|многозначность|disambig)/i.test(txt)) continue;
    if(year && !txt.slice(0,4000).includes(String(year))) continue;
    const m=txt.match(/\|\s*(Постер|Изображение|Обложка|image)\s*=\s*(?:\[\[(?:Файл|File|Изображение):)?([^\n|\]]+\.(?:jpe?g|png|gif|webp))/i);
    if(!m) continue;
    const ii=Object.values((await wj("action=query&prop=imageinfo&iiprop=url&iiurlwidth=400&titles="+encodeURIComponent("Файл:"+m[2].trim()))).query.pages)[0].imageinfo?.[0];
    if(ii) return (ii.thumburl||ii.url).split("?")[0];
  }
  return "";
}
let pq=Promise.resolve();
function queuePoster(f,force){
  if(f.poster && !force) return;
  pq=pq.then(async()=>{
    try{ const url=await lookupPoster(f.title,f.year); if(url && url!==f.poster){ f.poster=url; save(); rerender(); } }
    catch(e){ console.warn("poster",e); }
  });
}

/* ---------- общее ---------- */
function meta(f){ return [f.year,f.genre].filter(Boolean).join(" · "); }
function kp(t){ return "https://www.kinopoisk.ru/index.php?kp_query="+encodeURIComponent(t); }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove("show"),2400); }
let currentView="spin";
function rerender(){ if(currentView==="spin"){ if(!spinning) renderSpin(); } else if(currentView==="watched") renderWatched(); else renderPool(); }

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  currentView=b.dataset.view;
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x===b));
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active",v.id===currentView));
  rerender();
});
$("#today").textContent = new Date().toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long"}).replace(/^./,c=>c.toUpperCase());

/* ---------- рулетка ---------- */
let spinning=false;
const step=()=>{ const c=document.querySelector(".card"); return c? c.getBoundingClientRect().width+12 : 162; };
const cardW=()=>step()-12;
function cardHTML(f,win){ return `<div class="card poster${win?" win":""}" style="--g:${grad(f.title)}">${posterHTML(f)}<div class="cap"><div class="t">${esc(f.title)}</div><div class="y">${f.year||""}</div></div></div>`; }
const rnd=a=>a[Math.floor(Math.random()*a.length)];

function idleStrip(center){
  const strip=$("#strip"), box=$(".roulette");
  const pool=S.pool.length?S.pool:[{id:"x",title:"Список пуст",year:""}];
  const items=[]; for(let i=0;i<15;i++) items.push(rnd(pool));
  const mid=7; if(center) items[mid]=center;
  strip.style.transition="none";
  strip.innerHTML=items.map((f,i)=>cardHTML(f,center&&i===mid)).join("");
  strip.style.transform=`translateX(${box.clientWidth/2-(mid*step()+cardW()/2)}px)`;
}

function spin(excludeId){
  return new Promise(resolve=>{
    const candidates=S.pool.filter(f=>f.id!==excludeId);
    if(!candidates.length){ toast("Фильмы закончились — добавь новые во вкладке «Все фильмы»"); return resolve(null); }
    const winner=rnd(candidates);
    const strip=$("#strip"), box=$(".roulette");
    const total=60, winIdx=52, items=[];
    for(let i=0;i<total;i++) items.push(rnd(S.pool));
    items[winIdx]=winner;
    strip.style.transition="none";
    strip.innerHTML=items.map(f=>cardHTML(f,false)).join("");
    const st=step(), cw=cardW();
    strip.style.transform=`translateX(${box.clientWidth/2-(3*st+cw/2)}px)`;
    strip.offsetWidth;
    const jitter=(Math.random()-.5)*cw*0.7;
    const endX=box.clientWidth/2-(winIdx*st+cw/2)+jitter;
    strip.style.transition="transform 5.5s cubic-bezier(.12,.75,.12,1)";
    strip.style.transform=`translateX(${endX}px)`;
    spinning=true;
    // лёгкая вибрация в Telegram во время прокрутки
    let ticks=0; const tk=setInterval(()=>{ if(++ticks>18) clearInterval(tk); else haptic("tick"); },120+ticks*10);
    setTimeout(()=>{
      clearInterval(tk);
      strip.style.transition="transform .35s ease-out";
      strip.style.transform=`translateX(${box.clientWidth/2-(winIdx*st+cw/2)}px)`;
      strip.children[winIdx].classList.add("win");
      spinning=false; haptic("success"); resolve(winner);
    },5600);
  });
}

function currentFilm(){ return S.pool.find(f=>f.id===S.day.current)||S.watched.find(f=>f.id===S.day.current); }

function renderSpin(){
  const d=S.day, f=currentFilm();
  $("#spinWrap").style.display="none"; $("#result").classList.remove("show"); $("#done").classList.remove("show");
  if(d.decided&&f){
    $("#done").classList.add("show");
    fillPoster($("#dPoster"),f); $("#dTitle").textContent=f.title; $("#dMeta").textContent=meta(f);
    $("#dSearch").onclick=()=>openLink(kp(f.title));
    idleStrip(f);
  } else if(f){
    showResult(f); idleStrip(f);
  } else {
    $("#spinWrap").style.display="block";
    $("#spinBtn").disabled=!S.pool.length;
    $("#spinBtn").textContent=S.pool.length?"КРУТИТЬ":"НЕТ ФИЛЬМОВ";
    idleStrip(null);
  }
}
function showResult(f){
  fillPoster($("#rPoster"),f);
  $("#rTitle").textContent=f.title; $("#rMeta").textContent=meta(f);
  $("#rSearch").onclick=()=>openLink(kp(f.title));
  $("#result").classList.add("show");
  $("#skipBtn").disabled=S.day.rerollUsed||S.pool.length<2;
  $("#hint").textContent=S.day.rerollUsed?"Перекрутка на сегодня уже использована — либо смотрим, либо до завтра 🙂":"Перекрутить можно 1 раз в день";
}

$("#spinBtn").onclick=async()=>{
  if(spinning||S.day.current) return;
  $("#spinBtn").disabled=true;
  const w=await spin(null);
  if(!w){ renderSpin(); return; }
  S.day.current=w.id; save();
  $("#spinWrap").style.display="none"; showResult(w);
};
$("#skipBtn").onclick=async()=>{
  if(spinning||S.day.rerollUsed) return;
  const prev=S.day.current;
  S.day.rerollUsed=true; save();
  $("#result").classList.remove("show");
  const w=await spin(prev);
  if(w){ S.day.current=w.id; save(); }
  renderSpin();
};
$("#watchBtn").onclick=()=>{
  if(spinning) return;
  const i=S.pool.findIndex(f=>f.id===S.day.current); if(i<0) return;
  const [f]=S.pool.splice(i,1);
  S.watched.push({...f,date:todayStr(),rating:0});
  S.day.decided=true; save();
  toast("Добавлено в «Просмотрено»"); renderSpin();
};

/* ---------- просмотрено ---------- */
function starsHTML(f){ let h=""; for(let i=1;i<=10;i++) h+=`<button class="star${i<=f.rating?" on":""}" data-id="${esc(f.id)}" data-v="${i}" title="${i} из 10">★</button>`; return h; }
function thumbHTML(f){ return `<div class="thumb poster" data-edit="${esc(f.id)}" style="--g:${grad(f.title)}" title="Поменять постер">${posterHTML(f)}</div>`; }
function renderWatched(){
  const sort=$("#wSort").value; let arr=[...S.watched];
  if(sort==="date") arr.reverse();
  if(sort==="rating") arr.sort((a,b)=>b.rating-a.rating);
  if(sort==="title") arr.sort((a,b)=>a.title.localeCompare(b.title,"ru"));
  const rated=S.watched.filter(f=>f.rating);
  const avg=rated.length?(rated.reduce((s,f)=>s+f.rating,0)/rated.length).toFixed(1):null;
  $("#wCount").textContent=`${S.watched.length} фильм(ов)`+(avg?` · средняя оценка ${avg}`:"");
  $("#wList").innerHTML=arr.length?arr.map(f=>`
    <div class="item">${thumbHTML(f)}
      <div class="info"><div class="n">${esc(f.title)}</div>
        <div class="s">${esc(meta(f))} · ${new Date(f.date).toLocaleDateString("ru-RU")}</div>
        <div class="stars">${starsHTML(f)}</div></div>
      <div class="score${f.rating?"":" none"}">${f.rating?f.rating+"/10":"без оценки"}</div>
      <button class="x" data-back="${esc(f.id)}" title="Вернуть в рулетку">↩</button>
    </div>`).join(""):`<div class="empty">Пока пусто. Крути рулетку и жми «Смотреть»!</div>`;
}
$("#wSort").onchange=renderWatched;
$("#wList").addEventListener("click",e=>{
  const s=e.target.closest(".star");
  if(s){ const f=S.watched.find(x=>x.id===s.dataset.id); const v=+s.dataset.v; f.rating=(f.rating===v?0:v); save(); haptic("tick"); renderWatched(); return; }
  const b=e.target.closest("[data-back]");
  if(b){ const i=S.watched.findIndex(x=>x.id===b.dataset.back); const [f]=S.watched.splice(i,1); delete f.date; delete f.rating; S.pool.push(f); save(); renderWatched(); toast("Фильм возвращён в рулетку"); return; }
  const t=e.target.closest("[data-edit]"); if(t) openModal(t.dataset.edit);
});
$("#wList").addEventListener("mouseover",e=>{ const s=e.target.closest(".star"); if(!s) return; const v=+s.dataset.v; s.parentElement.querySelectorAll(".star").forEach(x=>x.classList.toggle("on",+x.dataset.v<=v)); });
$("#wList").addEventListener("mouseout",e=>{ const box=e.target.closest(".stars"); if(!box||box.contains(e.relatedTarget)) return; const f=S.watched.find(x=>x.id===box.querySelector(".star").dataset.id); box.querySelectorAll(".star").forEach(x=>x.classList.toggle("on",+x.dataset.v<=f.rating)); });

/* ---------- все фильмы ---------- */
function renderPool(){
  const q=$("#pFilter").value.trim().toLowerCase();
  const arr=S.pool.filter(f=>!q||f.title.toLowerCase().includes(q)||(f.genre||"").toLowerCase().includes(q)).sort((a,b)=>a.title.localeCompare(b.title,"ru"));
  $("#pCount").textContent=`${S.pool.length} фильм(ов) ещё не просмотрено`;
  $("#pList").innerHTML=arr.length?arr.map(f=>`
    <div class="item">${thumbHTML(f)}
      <div class="info"><div class="n">${esc(f.title)}</div><div class="s">${esc(meta(f))}</div></div>
      <button class="x" data-del="${esc(f.id)}" title="Убрать из рулетки">✕</button>
    </div>`).join(""):`<div class="empty">Ничего не найдено</div>`;
}
$("#pFilter").oninput=renderPool;
$("#pList").addEventListener("click",e=>{
  const t=e.target.closest("[data-edit]"); if(t){ openModal(t.dataset.edit); return; }
  const b=e.target.closest("[data-del]"); if(!b) return;
  if(b.dataset.del===S.day.current&&!S.day.decided){ toast("Этот фильм сейчас выпал — сначала реши, смотреть или нет"); return; }
  S.pool=S.pool.filter(f=>f.id!==b.dataset.del); save(); renderPool();
});
function addFilm(){
  const title=$("#addTitle").value.trim(); if(!title){ $("#addTitle").focus(); return; }
  const year=parseInt($("#addYear").value)||""; const genre=$("#addGenre").value.trim();
  if(S.pool.concat(S.watched).some(f=>f.title.toLowerCase()===title.toLowerCase())){ toast("Такой фильм уже есть"); return; }
  const d=DEF_BY_TITLE[title.toLowerCase()];
  const f=d?{...d}:{id:uid(),title,year,genre,poster:""};
  S.pool.push(f); save();
  $("#addTitle").value=$("#addYear").value=$("#addGenre").value="";
  renderPool(); toast("Добавлено: "+title+(f.poster?"":" — ищу постер…"));
  queuePoster(f);
}
$("#addBtn").onclick=addFilm;
["#addTitle","#addYear","#addGenre"].forEach(s=>$(s).addEventListener("keydown",e=>{ if(e.key==="Enter") addFilm(); }));

/* ---------- модалка постера ---------- */
let mFilm=null, mUrl="";
function mPreview(){ fillPoster($("#mPoster"),{...mFilm,poster:mUrl}); }
function openModal(id){
  mFilm=findFilm(id); if(!mFilm) return;
  S.modalFilm=mFilm; mUrl=mFilm.poster||"";
  $("#mTitle").textContent=mFilm.title; $("#mUrl").value=mUrl; mPreview();
  $("#modal").classList.add("show");
}
function closeModal(){ $("#modal").classList.remove("show"); S.modalFilm=null; mFilm=null; }
$("#mCancel").onclick=closeModal;
$("#modal").onclick=e=>{ if(e.target.id==="modal") closeModal(); };
$("#mUrl").oninput=()=>{ mUrl=$("#mUrl").value.trim(); mPreview(); };
$("#mClear").onclick=()=>{ mUrl=""; $("#mUrl").value=""; mPreview(); };
$("#mAuto").onclick=async()=>{
  const b=$("#mAuto"); b.disabled=true; b.textContent="Ищу…";
  try{ const u=await lookupPoster(mFilm.title,mFilm.year); if(u){ mUrl=u; $("#mUrl").value=u; mPreview(); } else toast("Не нашёл постер — вставь ссылку вручную"); }
  catch(e){ toast("Нет связи с Википедией"); }
  b.disabled=false; b.textContent="Найти автоматически";
};
$("#mSave").onclick=()=>{ mFilm.poster=mUrl; save(); closeModal(); rerender(); };

/* ---------- резервная копия ---------- */
$("#exportBtn").onclick=()=>{
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(compact(S),null,1)],{type:"application/json"}));
  a.download=`kino-backup-${todayStr()}.json`; document.body.appendChild(a); a.click(); a.remove();
};
$("#importBtn").onclick=()=>$("#importFile").click();
$("#importFile").onchange=async e=>{
  const file=e.target.files[0]; if(!file) return;
  try{
    const d=JSON.parse(await file.text()); if(!Array.isArray(d.pool)||!Array.isArray(d.watched)) throw 0;
    S=expand(d); if(!S.day||S.day.date!==todayStr()) S.day={date:todayStr(),current:null,rerollUsed:false,decided:false};
    save(); rerender(); toast("Копия загружена");
  }catch(err){ toast("Не получилось прочитать файл"); }
  e.target.value="";
};

window.addEventListener("resize",()=>{ if(!spinning&&currentView==="spin") renderSpin(); });

/* ---------- старт ---------- */
(async()=>{
  S=await loadState(); save(); renderSpin();
  // постеры для своих фильмов, у которых их ещё нет
  S.pool.concat(S.watched).filter(f=>!f.poster&&!DEF[f.id]).slice(0,30).forEach(f=>queuePoster(f));
  // новый день наступил, пока приложение открыто
  setInterval(()=>{ if(S.day.date!==todayStr()&&!spinning){ S.day={date:todayStr(),current:null,rerollUsed:false,decided:false}; save(); $("#today").textContent=new Date().toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long"}).replace(/^./,c=>c.toUpperCase()); rerender(); } },60000);
})();
</script>
